<!doctype html>
<html lang="zh-CN">
    <head>
        <title id="title">西林电气会议 - 自定义房间</title>
        <link
            id="icon"
            rel="shortcut icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232c7be5'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%A5%BF%3C/text%3E%3C/svg%3E"
        />
        <link
            id="appleTouchIcon"
            rel="apple-touch-icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232c7be5'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E8%A5%BF%3C/text%3E%3C/svg%3E"
        />

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <link rel="stylesheet" type="text/css" href="../css/CustomizeRoom.css" />

        <!-- xss (provides filterXSS) -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>
    </head>
    <body>
        <header class="cr-header">
            <a class="cr-brand" href="/" aria-label="西林电气会议首页">
                <span>西林电气会议</span>
            </a>
            <a class="cr-back" href="/">返回首页</a>
        </header>
        <main class="cr-page">
            <div class="cr-intro">
                <p class="cr-eyebrow">房间设置</p>
                <h1 class="cr-title">打造你的专属房间</h1>
                <p class="cr-lead">选择进入方式、默认开启的功能，生成一条即开即用的入会链接。</p>
            </div>

            <form id="customizeRoomForm" class="cr-layout" autocomplete="off">
                <div class="cr-settings">
                    <section class="cr-section" aria-labelledby="cr-room-heading">
                        <div class="cr-section-heading">
                            <span class="cr-step">01</span>
                            <div>
                                <h2 id="cr-room-heading">房间信息</h2>
                                <p>为会议空间命名并设置保护。</p>
                            </div>
                        </div>
                        <div class="cr-field-grid">
                            <div class="cr-field cr-field-wide">
                                <label class="cr-label" for="room">房间名称</label>
                                <div class="cr-input-wrap">
                                    <input
                                        id="room"
                                        name="room"
                                        class="cr-input"
                                        type="text"
                                        inputmode="text"
                                        placeholder="团队例会"
                                        maxlength="64"
                                        required
                                    />
                                    <button id="crRandomRoom" class="cr-input-action" type="button">生成</button>
                                </div>
                            </div>
                            <div class="cr-field">
                                <label class="cr-label" for="name">显示名称</label>
                                <input
                                    id="name"
                                    name="name"
                                    class="cr-input"
                                    type="text"
                                    inputmode="text"
                                    placeholder="他人看到的名称"
                                    maxlength="64"
                                />
                            </div>
                            <div class="cr-field">
                                <label class="cr-label" for="roomPassword">
                                    房间密码 <span class="cr-optional">可选</span>
                                </label>
                                <input
                                    id="roomPassword"
                                    name="roomPassword"
                                    class="cr-input"
                                    type="password"
                                    inputmode="text"
                                    placeholder="为房间设置密码"
                                    maxlength="128"
                                />
                            </div>
                        </div>
                    </section>

                    <section class="cr-section" aria-labelledby="cr-options-heading">
                        <div class="cr-section-heading">
                            <span class="cr-step">02</span>
                            <div>
                                <h2 id="cr-options-heading">会议默认项</h2>
                                <p>设置在进入房间时默认开启的功能。</p>
                            </div>
                        </div>
                        <div class="cr-toggle-grid" aria-label="会议默认项">
                            <label class="cr-toggle" for="audio">
                                <span class="cr-option-copy"
                                    ><strong>麦克风</strong><small>进入时开启麦克风</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="audio" name="audio" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="cr-toggle" for="video">
                                <span class="cr-option-copy"
                                    ><strong>摄像头</strong><small>进入时开启摄像头</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="video" name="video" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="cr-toggle" for="screen">
                                <span class="cr-option-copy"
                                    ><strong>共享屏幕</strong><small>进入时开始共享</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="screen" name="screen" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="cr-toggle" for="chat">
                                <span class="cr-option-copy"
                                    ><strong>打开聊天</strong><small>进入时显示聊天</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="chat" name="chat" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="cr-toggle" for="hide">
                                <span class="cr-option-copy"
                                    ><strong>隐藏自己</strong><small>隐藏自己的视频画面</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="hide" name="hide" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="cr-toggle" for="notify">
                                <span class="cr-option-copy"
                                    ><strong>提醒房间</strong><small>共享媒体时通知房间</small></span
                                >
                                <span class="cr-switch-wrap">
                                    <input id="notify" name="notify" type="checkbox" />
                                    <span class="cr-switch" aria-hidden="true"></span>
                                </span>
                            </label>
                        </div>
                        <div class="cr-field cr-duration">
                            <label class="cr-label" for="duration">
                                会议时长 <span class="cr-optional">可选</span>
                            </label>
                            <input
                                id="duration"
                                name="duration"
                                class="cr-input"
                                type="text"
                                inputmode="numeric"
                                placeholder="00:30:00"
                                pattern="^\d{2}:\d{2}:\d{2}$"
                                maxlength="8"
                            />
                            <p class="cr-hint">使用 时:分:秒 格式，留空表示不限时。</p>
                        </div>
                    </section>

                    <details class="cr-section cr-advanced">
                        <summary>
                            <span class="cr-step">03</span>
                            <span><strong>高级访问</strong><small>头像与访问令牌</small></span>
                            <span class="cr-chevron" aria-hidden="true"></span>
                        </summary>
                        <div class="cr-field-grid cr-advanced-fields">
                            <div class="cr-field">
                                <label class="cr-label" for="avatar">头像链接</label>
                                <input
                                    id="avatar"
                                    name="avatar"
                                    class="cr-input"
                                    type="url"
                                    inputmode="url"
                                    placeholder="https://example.com/avatar.png"
                                    maxlength="512"
                                />
                            </div>
                            <div class="cr-field">
                                <label class="cr-label" for="token">访问令牌</label>
                                <input
                                    id="token"
                                    name="token"
                                    class="cr-input"
                                    type="text"
                                    inputmode="text"
                                    placeholder="受保护主机所需"
                                    maxlength="2048"
                                />
                            </div>
                        </div>
                    </details>
                </div>

                <aside class="cr-summary" aria-labelledby="cr-summary-heading">
                    <div class="cr-summary-status"><span></span> 准备好了就可以开始</div>
                    <h2 id="cr-summary-heading">你的房间链接</h2>
                    <p>随设置实时更新。</p>
                    <label class="cr-sr-only" for="crPreviewUrl">入会链接</label>
                    <input id="crPreviewUrl" class="cr-input cr-preview" type="text" readonly />
                    <div class="cr-actions" aria-label="链接操作">
                        <button id="crCopy" class="cr-copy" type="button" aria-label="复制入会链接">
                            <span aria-hidden="true">复制</span>
                        </button>
                        <button id="crShare" class="cr-copy cr-share" type="button" aria-label="分享入会链接" hidden>
                            分享
                        </button>
                    </div>
                    <div id="crQrWrap" class="cr-qr-wrap" hidden>
                        <div id="crQr" class="cr-qr" role="img" aria-label="入会链接二维码"></div>
                        <p class="cr-hint cr-qr-hint">扫码在其他设备上打开。</p>
                    </div>
                    <p id="crStatus" class="cr-status" role="status" aria-live="polite"></p>
                    <p id="crError" class="cr-error" role="alert" hidden></p>
                    <button class="cr-submit" type="submit">加入房间 <span aria-hidden="true">→</span></button>
                    <p class="cr-privacy">你的设置已编码进链接中，此处不会保存。</p>
                </aside>
            </form>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
        <script src="../js/CustomizeRoom.js"></script>
    </body>
</html>
